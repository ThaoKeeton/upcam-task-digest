name: Windows desktop build
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '*.py'
      - 'upcam_app/**'
      - 'templates/**'
      - 'examples/**'
      - 'requirements-build.txt'
      - '.github/workflows/windows-build.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  windows-exe:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: pyinstaller --clean --noconfirm --onefile --windowed --name UPCAMTaskDigest --collect-all tzdata --add-data "templates;templates" --add-data "examples;examples" desktop_app.py
      - name: Smoke test packaged application and tabs
        shell: pwsh
        run: |
          & .\dist\UPCAMTaskDigest.exe --ui-smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Desktop EXE smoke test failed with exit code $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: UPCAMTaskDigest-windows
          path: dist/UPCAMTaskDigest.exe
          retention-days: 14
