name: Windows desktop build
on:
  workflow_dispatch:
    inputs:
      publish_stable:
        description: 'Publish this tested main version as a stable private GitHub Release'
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - '*.py'
      - 'upcam_app/**'
      - 'templates/**'
      - 'examples/**'
      - 'tests/**'
      - 'winui/**'
      - 'requirements-build.txt'
      - '.github/workflows/windows-build.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  windows-exe:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: pyinstaller --clean --noconfirm --onefile --console --name UPCAMTaskDigestSmoke --collect-all tzdata --collect-all pystray --collect-all PIL --add-data "templates;templates" --add-data "examples;examples" desktop_app.py
      - name: Diagnose packaged application and tabs
        shell: pwsh
        run: |
          & .\dist\UPCAMTaskDigestSmoke.exe --ui-smoke-test --capture-screenshot .\dist\UPCAMTaskDigest-ui.png
          if ($LASTEXITCODE -ne 0) { throw "Console desktop EXE smoke test failed with exit code $LASTEXITCODE" }
      - run: pyinstaller --noconfirm --onefile --windowed --name UPCAMTaskDigest --collect-all tzdata --collect-all pystray --collect-all PIL --add-data "templates;templates" --add-data "examples;examples" desktop_app.py
      - name: Smoke test final windowed EXE
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\UPCAMTaskDigest.exe" -ArgumentList "--ui-smoke-test --background" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Windowed desktop EXE smoke test failed with exit code $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: UPCAMTaskDigest-legacy-Tk-windows
          path: |
            dist/UPCAMTaskDigest.exe
            dist/UPCAMTaskDigest-ui.png
          retention-days: 14
  windows-winui:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r requirements-build.txt
      - name: Verify core and Windows DPAPI with synthetic values
        run: python -m unittest discover -s tests -v
      - name: Package headless Python worker
        run: pyinstaller --clean --noconfirm --onedir --console --name UPCAMWorker --collect-all tzdata --add-data "templates;templates" --add-data "examples;examples" worker_entry.py
      - name: Publish genuine WinUI 3 desktop application
        run: dotnet publish winui/UPCAMTaskDigest/UPCAMTaskDigest.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o dist/winui
      - name: Assemble self-contained application
        shell: pwsh
        run: |
          if (-not (Test-Path dist/winui/UPCAMTaskDigest.pri)) {
            throw "Compiled application XAML resource index was not published"
          }
          Copy-Item dist/UPCAMWorker -Destination dist/winui/worker -Recurse
          $manifest = @{
            sourceCommit = (git rev-parse HEAD)
            applicationVersion = (& python -c "from upcam_app import APP_VERSION; print(APP_VERSION)")
            rulesetRevision = (& python -c "from upcam_app import RULESET_REVISION; print(RULESET_REVISION)")
            framework = "WinUI 3 / Windows App SDK 2.6.5"
            worker = "Python 3.12 / existing UPCAM core"
            applicationSha256 = (Get-FileHash dist/winui/UPCAMTaskDigest.exe -Algorithm SHA256).Hash
            workerSha256 = (Get-FileHash dist/winui/worker/UPCAMWorker.exe -Algorithm SHA256).Hash
          }
          $manifest | ConvertTo-Json | Set-Content dist/winui/build-info.json -Encoding utf8
      - name: Launch and interact with real WinUI controls using isolated synthetic services
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$PWD/dist/winui/UPCAMTaskDigest.exe" -ArgumentList "--ui-smoke-test" -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force
            throw "WinUI interaction smoke timed out"
          }
          if (Test-Path dist/winui/smoke-output/result.txt) { Get-Content dist/winui/smoke-output/result.txt }
          if (Test-Path dist/winui/smoke-output/xaml-trace.txt) { Get-Content dist/winui/smoke-output/xaml-trace.txt }
          if ($process.ExitCode -ne 0) {
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-4)} -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in @('.NET Runtime', 'Application Error') } |
              ForEach-Object { $_.Message }
            throw "WinUI smoke failed: $($process.ExitCode)"
          }
          $report = Get-Content dist/winui/smoke-output/report.json | ConvertFrom-Json
          if (-not $report.success -or $report.steps.Count -lt 30) { throw "WinUI smoke report incomplete" }
          Copy-Item dist/winui/smoke-output -Destination dist/ui-evidence -Recurse
      - name: Package portable application directory
        shell: pwsh
        run: |
          Remove-Item dist/winui/smoke-output -Recurse
          Compress-Archive -Path dist/winui/* -DestinationPath dist/UPCAMTaskDigest-WinUI3-win-x64.zip
          $hash = (Get-FileHash dist/UPCAMTaskDigest-WinUI3-win-x64.zip -Algorithm SHA256).Hash
          "$hash  UPCAMTaskDigest-WinUI3-win-x64.zip" | Set-Content dist/UPCAMTaskDigest-WinUI3-win-x64.zip.sha256
      - name: Verify extracted ZIP and background startup
        shell: pwsh
        run: |
          Expand-Archive dist/UPCAMTaskDigest-WinUI3-win-x64.zip -DestinationPath dist/install-check
          foreach ($file in @('UPCAMTaskDigest.exe', 'UPCAMTaskDigest.dll', 'UPCAMTaskDigest.pri', 'coreclr.dll', 'hostfxr.dll',
                               'CommunityToolkit.WinUI.Controls.SettingsControls.dll', 'THIRD_PARTY_NOTICES.md',
                               'LICENSES/PowerToys-MIT.txt', 'LICENSES/CommunityToolkit-MIT.txt',
                               'Assets/Teambition.ico', 'Assets/Teambition.png',
                               'worker/UPCAMWorker.exe', 'worker/_internal/templates/daily_digest.json', 'worker/_internal/examples/digest.json')) {
            if (-not (Test-Path "dist/install-check/$file")) { throw "Package missing $file" }
          }
          $manifest = Get-Content dist/install-check/build-info.json | ConvertFrom-Json
          if ((Get-FileHash dist/install-check/UPCAMTaskDigest.exe -Algorithm SHA256).Hash -ne $manifest.applicationSha256) {
            throw "Packaged application hash mismatch"
          }
          if ((Get-FileHash dist/install-check/worker/UPCAMWorker.exe -Algorithm SHA256).Hash -ne $manifest.workerSha256) {
            throw "Packaged worker hash mismatch"
          }
          $handoffParent = Start-Process -FilePath (Get-Process -Id $PID).Path -ArgumentList '-NoProfile', '-Command', 'Start-Sleep -Seconds 2' -PassThru
          $process = Start-Process -FilePath "$PWD/dist/install-check/UPCAMTaskDigest.exe" -ArgumentList "--ui-smoke-test --background --wait-for-parent $($handoffParent.Id) --after-update" -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force
            throw "Extracted background WinUI smoke timed out"
          }
          if (Test-Path dist/install-check/smoke-output/result.txt) { Get-Content dist/install-check/smoke-output/result.txt }
          if ($process.ExitCode -ne 0) { throw "Extracted background WinUI smoke failed" }
          $report = Get-Content dist/install-check/smoke-output/report.json | ConvertFrom-Json
          if (-not $report.success) { throw "Extracted ZIP did not pass native UI validation" }
          Copy-Item dist/install-check/smoke-output/report.json dist/ui-evidence/background-report.json
          Get-Content dist/ui-evidence/report.json
          Get-Content dist/ui-evidence/background-report.json
      - name: Publish synthetic UI snapshot for review
        if: always()
        shell: pwsh
        run: |
          $image = "$PWD/dist/ui-evidence/statuses.png"
          if (-not (Test-Path $image)) { $image = "$PWD/dist/winui/smoke-output/statuses.png" }
          if (Test-Path $image) {
            Write-Output "::group::Synthetic status page snapshot"
            Write-Output ("UPCAM_STATUS_PNG_BASE64=" + [Convert]::ToBase64String([IO.File]::ReadAllBytes($image)))
            Write-Output "::endgroup::"
          }
          foreach ($name in @('native-window', 'tray-icon', 'run', 'schedule', 'dingtalk', 'general-english-light', 'general-chinese-dark')) {
            $nativeImage = "$PWD/dist/ui-evidence/$name.png"
            if (-not (Test-Path $nativeImage)) { $nativeImage = "$PWD/dist/winui/smoke-output/$name.png" }
            if (Test-Path $nativeImage) {
              Write-Output "::group::Synthetic native $name evidence"
              Write-Output ("UPCAM_NATIVE_" + $name + "_PNG_BASE64=" + [Convert]::ToBase64String([IO.File]::ReadAllBytes($nativeImage)))
              Write-Output "::endgroup::"
            }
          }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: UPCAMTaskDigest-WinUI3-windows-x64
          path: |
            dist/UPCAMTaskDigest-WinUI3-win-x64.zip
            dist/UPCAMTaskDigest-WinUI3-win-x64.zip.sha256
            dist/ui-evidence/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: UPCAMTaskDigest-WinUI3-failure-evidence
          path: |
            dist/ui-evidence/
            dist/winui/smoke-output/
            dist/install-check/smoke-output/
          retention-days: 14
  publish-stable:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_stable == true && github.ref == 'refs/heads/main' }}
    needs: [tests, windows-winui, windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: UPCAMTaskDigest-WinUI3-windows-x64
          path: release-bundle
      - name: Verify this complete application before creating a draft release
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, re, zipfile
          from pathlib import Path
          from upcam_app import APP_VERSION, RULESET_REVISION
          assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', APP_VERSION)
          package = Path('release-bundle/UPCAMTaskDigest-WinUI3-win-x64.zip')
          checksum = Path(str(package) + '.sha256').read_text(encoding='utf-8-sig').split()[0].lower()
          assert hashlib.sha256(package.read_bytes()).hexdigest() == checksum
          with zipfile.ZipFile(package) as archive:
              manifest = json.loads(archive.read('build-info.json'))
              assert manifest['sourceCommit'] == os.environ['GITHUB_SHA']
              assert manifest['applicationVersion'] == APP_VERSION
              assert manifest['rulesetRevision'] == RULESET_REVISION
          Path('release-tag.txt').write_text('v' + APP_VERSION)
          Path('release-notes.txt').write_text('UPCAM Task Digest ' + APP_VERSION + '\n\n'
              'WinUI 3 x64 portable application. Extract the whole ZIP and retain DLLs and worker.\n'
              'Source commit: ' + os.environ['GITHUB_SHA'] + '\n'
              'Rules revision: ' + RULESET_REVISION + '\n'
              'ZIP SHA-256: ' + checksum + '\n', encoding='utf-8')
          PY
      - name: Create a new draft without overwriting existing versions
        shell: bash
        run: |
          tag=$(cat release-tag.txt)
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY'] == 'ThaoKeeton/upcam-task-digest'
          tag = Path('release-tag.txt').read_text()
          result = subprocess.run(['gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/ref/tags/' + tag], capture_output=True, text=True)
          if result.returncode == 0:
              reference = json.loads(result.stdout)
              assert reference['object']['type'] == 'commit' and reference['object']['sha'] == os.environ['GITHUB_SHA'], 'Existing tag does not match this tested source'
          elif '(HTTP 404)' not in result.stderr:
              raise RuntimeError('Unable to verify existing release tag; nothing published')
          PY
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This version already has a Release. Publish a new version instead.'
            exit 1
          fi
          gh release create "$tag" release-bundle/UPCAMTaskDigest-WinUI3-win-x64.zip release-bundle/UPCAMTaskDigest-WinUI3-win-x64.zip.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "UPCAM Task Digest $tag" --notes-file release-notes.txt --draft
      - name: Verify GitHub asset digest then publish the stable release
        shell: bash
        run: |
          tag=$(cat release-tag.txt)
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > release-metadata.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          release = json.loads(Path('release-metadata.json').read_text())
          assert release['draft'] is True and release['prerelease'] is False
          assert release['target_commitish'] == os.environ['GITHUB_SHA']
          name = 'UPCAMTaskDigest-WinUI3-win-x64.zip'
          assets = [asset for asset in release['assets'] if asset['name'] == name]
          assert len(assets) == 1 and assets[0]['state'] == 'uploaded'
          expected = hashlib.sha256(Path('release-bundle', name).read_bytes()).hexdigest()
          assert assets[0]['digest'].lower() == 'sha256:' + expected
          PY
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
