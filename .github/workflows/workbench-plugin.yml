name: Workbench native digest plugin

on:
  push:
    branches: [fix/diagnostic-progress-cancel]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'plugins/UPCAM.Workbench/**'
      - 'integrations/project-workbench/**'
      - 'plugin_worker_entry.py'
      - 'upcam_app/**'
      - '*.py'
      - 'tests/**'
      - 'templates/**'
      - 'examples/**'
      - 'requirements-build.txt'
      - 'THIRD_PARTY_NOTICES.md'
      - 'LICENSES/**'
      - 'winui/UPCAMTaskDigest/DesktopState.cs'
      - 'winui/UPCAMTaskDigest/UiStrings.cs'
      - 'winui/UPCAMTaskDigest/WorkerProtocol.cs'
      - 'winui/UPCAMTaskDigest/CollectionProgressText.cs'
      - 'winui/UPCAMTaskDigest/Strings/en-US.json'
      - '.gitattributes'
      - '.github/workflows/workbench-plugin.yml'

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable actual host SDK inputs
        run: python integrations/project-workbench/verify_reference.py
      - name: Synthetic core, adapter and packaging regression
        run: python -m unittest discover -s tests -v

  windows-native:
    needs: portable
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: integrations/project-workbench/reference/global.json
      - run: python -m pip install -r requirements-build.txt
      - name: Build production and visibly synthetic native plugin packages
        shell: pwsh
        run: ./integrations/project-workbench/build-plugin.ps1 -BuildAcceptance
      - name: Windows DPAPI, profile and core regression with synthetic values
        run: python -m unittest discover -s tests -v
      - name: Publish actual SDK and Core native integration acceptance host
        shell: pwsh
        run: |
          dotnet publish integrations/project-workbench/tests/Acceptance/Workbench.Digest.Acceptance.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o dist/workbench-plugin/acceptance-host
          if ($LASTEXITCODE -ne 0) { throw 'Native acceptance host publish failed.' }
      - name: Publish unmodified complete reference platform
        id: platform_build
        shell: pwsh
        run: |
          dotnet publish integrations/project-workbench/reference/src/Workbench.App/Workbench.App.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o dist/workbench-plugin/reference-platform
          if ($LASTEXITCODE -ne 0) { throw 'Complete reference platform publish failed.' }
          if (-not (Test-Path dist/workbench-plugin/reference-platform/Workbench.App.pri)) { throw 'Complete host XAML resources are missing.' }
      - name: Process handshake, timeout, cancellation, singleton and crash cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path (Get-Location) 'dist/workbench-plugin/evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          dotnet run --project integrations/project-workbench/tests/Transport/UPCAM.Workbench.TransportTests.csproj -c Release -- --report (Join-Path $evidence 'transport-report.json') *> (Join-Path $evidence 'transport.txt')
          $result = $LASTEXITCODE
          Get-Content (Join-Path $evidence 'transport.txt')
          if ($result -ne 0) { throw "Process transport regression failed with exit code $result" }
      - name: Extract archives and validate actual installed package inventory
        id: extract_packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path (Get-Location) 'dist/workbench-plugin/extracted installation with spaces'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Expand-Archive dist/workbench-plugin/UPCAMTaskDigest-workbench-production-0.1.1-win-x64.zip -DestinationPath $root
          Expand-Archive dist/workbench-plugin/UPCAMTaskDigest-workbench-acceptance-0.1.1-win-x64.zip -DestinationPath $root
          python integrations/project-workbench/audit_package.py (Join-Path $root 'com.upcam.task-digest')
          if ($LASTEXITCODE -ne 0) { throw 'Extracted production package validation failed.' }
          python integrations/project-workbench/audit_package.py (Join-Path $root 'com.upcam.task-digest.acceptance')
          if ($LASTEXITCODE -ne 0) { throw 'Extracted acceptance package validation failed.' }
      - name: Native install, trust, view, business parity, shutdown and restoration acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path (Get-Location) 'dist/workbench-plugin'
          $packageRoot = Join-Path $root 'extracted installation with spaces'
          $report = Join-Path $root 'evidence/native-report.json'
          $exe = Join-Path $root 'acceptance-host/Workbench.Digest.Acceptance.exe'
          $arguments = @('--package-directory', ('"' + (Join-Path $packageRoot 'com.upcam.task-digest.acceptance') + '"'),
            '--production-package-directory', ('"' + (Join-Path $packageRoot 'com.upcam.task-digest') + '"'),
            '--report', ('"' + $report + '"'))
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
          try {
            if (-not $process.WaitForExit(900000)) {
              try { $process.Kill($true) } catch { }
              throw 'Native integration acceptance exceeded fifteen minutes; owned process was stopped.'
            }
            if (Test-Path -LiteralPath $report -PathType Leaf) { Get-Content -LiteralPath $report }
            if ($process.ExitCode -ne 0) { throw "Native acceptance exited with $($process.ExitCode)." }
            if (-not (Test-Path -LiteralPath $report -PathType Leaf)) { throw 'Native acceptance report is missing.' }
            $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
            if (-not $result.succeeded) { throw 'Native acceptance reported failure.' }
          }
          finally { $process.Dispose() }
      - name: Complete platform trust, native page and graceful shutdown
        if: always() && !cancelled() && steps.platform_build.outcome == 'success' && steps.extract_packages.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path (Get-Location) 'dist/workbench-plugin'
          $package = Join-Path $root 'extracted installation with spaces/com.upcam.task-digest'
          $bundled = Join-Path $root 'reference-platform/Plugins'
          New-Item -ItemType Directory -Path $bundled -Force | Out-Null
          Copy-Item -LiteralPath $package -Destination (Join-Path $bundled 'com.upcam.task-digest') -Recurse
          $hostExe = Join-Path $root 'reference-platform/Workbench.App.exe'
          $report = Join-Path $root 'evidence/actual-platform-report.json'
          $screenshot = Join-Path $root 'evidence/actual-platform.png'
          $driver = Join-Path (Get-Location) 'integrations/project-workbench/test-real-host.ps1'
          $powershell = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $arguments = @('-NoProfile', '-NonInteractive', '-STA', '-File', ('"' + $driver + '"'),
            '-HostExe', ('"' + $hostExe + '"'), '-ReportPath', ('"' + $report + '"'),
            '-ScreenshotPath', ('"' + $screenshot + '"'))
          $process = Start-Process -FilePath $powershell -ArgumentList $arguments -PassThru
          try {
            if (-not $process.WaitForExit(300000)) {
              try { $process.Kill($true) } catch { }
              throw 'Complete host UI Automation exceeded five minutes; only its owned process tree was stopped.'
            }
            if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
            if ($process.ExitCode -ne 0) { throw "Complete host native smoke exited with $($process.ExitCode)." }
            if (-not (Test-Path -LiteralPath $report)) { throw 'Complete host native report is missing.' }
            $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
            if (-not $result.succeeded) { throw 'Complete host native smoke did not pass.' }
          }
          finally { $process.Dispose() }
      - name: Expose only synthetic and unconfigured native window screenshots for review
        if: always()
        shell: pwsh
        run: |
          $evidence = Join-Path (Get-Location) 'dist/workbench-plugin/evidence'
          if (Test-Path -LiteralPath $evidence) {
            Get-ChildItem -LiteralPath $evidence -Filter '*.png' -File -Recurse | ForEach-Object {
              $key = $_.BaseName.Replace('-', '_').ToUpperInvariant()
              Write-Output ('UPCAM_WORKBENCH_PNG_' + $key + '=' + [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName)))
            }
          }
      - name: Recheck immutable host source after native build
        run: python integrations/project-workbench/verify_reference.py
      - name: Record verified synthetic package handoff
        shell: pwsh
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path (Get-Location) 'dist/workbench-plugin'
          $fileName = 'UPCAMTaskDigest-workbench-acceptance-0.1.1-win-x64.zip'
          $archive = Join-Path $root $fileName
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $declaredHash = ((Get-Content -LiteralPath ($archive + '.sha256') -Raw).Trim() -split '\s+')[0]
          if ($declaredHash -cne $hash) { throw 'Acceptance archive checksum does not match.' }
          $metadata = Get-Content -LiteralPath (Join-Path $root 'packages/com.upcam.task-digest.acceptance/plugin-package.json') -Raw | ConvertFrom-Json
          if ($metadata.pluginId -cne 'com.upcam.task-digest.acceptance' -or $metadata.syntheticAcceptance -ne $true) {
            throw 'Acceptance artifact identity or synthetic build marker does not match.'
          }
          $buildCommit = (& git rev-parse HEAD).Trim()
          $sourceTree = (& git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $metadata.sourceCommit -cne $buildCommit -or
              $buildCommit -cnotmatch '^[0-9a-f]{40}$' -or $sourceTree -cnotmatch '^[0-9a-f]{40}$' -or
              $env:SOURCE_HEAD_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Cannot bind the artifact to the tested source.' }
          $handoff = [ordered]@{
            schemaVersion = 1
            pluginId = $metadata.pluginId
            pluginVersion = $metadata.pluginVersion
            syntheticAcceptance = $true
            fileName = $fileName
            fileBytes = (Get-Item -LiteralPath $archive).Length
            sha256 = $hash
            buildCommit = $buildCommit
            sourceHeadCommit = $env:SOURCE_HEAD_SHA
            sourceTree = $sourceTree
            backendVersion = $metadata.backendVersion
            hostReferenceCommit = $metadata.hostReferenceCommit
            minimumHostVersion = $metadata.minimumHostVersion
            apiVersion = 1
            runtimeServicesVersion = $metadata.runtimeServicesVersion
            windowsAppSdk = $metadata.windowsAppSdk
            publisherSignatureVerified = $false
          }
          $json = $handoff | ConvertTo-Json
          $json | Set-Content -LiteralPath (Join-Path $root 'acceptance-handoff.json') -Encoding utf8NoBOM
          Write-Output $json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: UPCAMTaskDigest-workbench-plugin-0.1.1-windows
          path: |
            dist/workbench-plugin/UPCAMTaskDigest-workbench-production-0.1.1-win-x64.zip
            dist/workbench-plugin/UPCAMTaskDigest-workbench-production-0.1.1-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: UPCAMTaskDigest-workbench-acceptance-0.1.1-windows
          path: |
            dist/workbench-plugin/UPCAMTaskDigest-workbench-acceptance-0.1.1-win-x64.zip
            dist/workbench-plugin/UPCAMTaskDigest-workbench-acceptance-0.1.1-win-x64.zip.sha256
            dist/workbench-plugin/acceptance-handoff.json
            dist/workbench-plugin/ACCEPTANCE.zh-CN.md
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UPCAMTaskDigest-workbench-plugin-validation
          path: |
            dist/workbench-plugin/evidence/
            dist/workbench-plugin/packages/*/plugin-package.json
          if-no-files-found: warn
          retention-days: 14

  shipping-pairing:
    needs: windows-native
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: integrations/project-workbench/reference/global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: UPCAMTaskDigest-workbench-plugin-0.1.1-windows
          path: pairing-input
      - name: Download pinned shipping Workbench 0.4.0 bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path pairing-evidence | Out-Null
          $zip = Join-Path (Get-Location) 'pairing-input/ProjectWorkbench-0.4.0-655d7b6.zip'
          Invoke-WebRequest -Uri 'https://api.github.com/repos/ThaoKeeton/project-workbench/actions/artifacts/13633291911/zip' -Headers @{
            Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28'
          } -OutFile $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -cne 'eee78758d3f38e94abe81a6c13f3252b76ce02c00f13375dd6d925e8dd6a9db4') { throw 'Exact shipping archive hash mismatch.' }
          Expand-Archive -LiteralPath $zip -DestinationPath pairing-host
          @{
            hostRepository = 'ThaoKeeton/project-workbench'; hostCommit = '655d7b6496067daad7c5e4cefb1f1da1b8379536';
            hostRunId = 42518602297L; hostArtifactId = 13633291911L; hostArchiveSha256 = $hash;
            hostExeSha256 = (Get-FileHash pairing-host/Workbench.App.exe -Algorithm SHA256).Hash.ToLowerInvariant();
            hostDllSha256 = (Get-FileHash pairing-host/Workbench.App.dll -Algorithm SHA256).Hash.ToLowerInvariant();
            hostCoreSha256 = (Get-FileHash pairing-host/Workbench.Core.dll -Algorithm SHA256).Hash.ToLowerInvariant();
            hostMode = 'unmodified shipping binary, normal UI'; pluginRunId = '${{ github.run_id }}';
            pluginSourceCommit = '${{ github.event.pull_request.head.sha || github.sha }}';
            pluginBuildCommit = (& git rev-parse HEAD).Trim()
          } | ConvertTo-Json | Set-Content pairing-evidence/inputs.json -Encoding utf8
      - name: Audit production package and compile installer against shipping Core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'pairing-input/UPCAMTaskDigest-workbench-production-0.1.1-win-x64.zip'
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $declared = ((Get-Content -LiteralPath ($zip + '.sha256') -Raw).Trim() -split '\s+')[0]
          if ($declared -cne $hash) { throw 'Production plugin archive checksum mismatch.' }
          Expand-Archive -LiteralPath $zip -DestinationPath 'pairing-package with spaces'
          python integrations/project-workbench/audit_package.py 'pairing-package with spaces/com.upcam.task-digest'
          if ($LASTEXITCODE -ne 0) { throw 'Production package inventory failed.' }
          $metadata = Get-Content 'pairing-package with spaces/com.upcam.task-digest/plugin-package.json' -Raw | ConvertFrom-Json
          if ($metadata.pluginId -cne 'com.upcam.task-digest' -or $metadata.pluginVersion -cne '0.1.1' -or $metadata.backendVersion -cne '0.4.5' -or $metadata.syntheticAcceptance -ne $false) { throw 'Production package identity mismatch.' }
          $inputs = Get-Content pairing-evidence/inputs.json -Raw | ConvertFrom-Json -AsHashtable
          if ($metadata.sourceCommit -cne $inputs.pluginBuildCommit) { throw 'Plugin artifact source commit does not match this workflow checkout.' }
          $inputs.pluginArchiveSha256 = $hash
          $inputs.pluginMetadataSourceCommit = $metadata.sourceCommit
          $inputs | ConvertTo-Json | Set-Content pairing-evidence/inputs.json -Encoding utf8
          $hostDirectory = Join-Path (Get-Location) 'pairing-host'
          dotnet publish integrations/project-workbench/shipping-pairing/ShippingInstall/ShippingInstall.csproj -c Release -r win-x64 --self-contained false "-p:ShippingHostDirectory=$hostDirectory" -o pairing-installer
          if ($LASTEXITCODE -ne 0) { throw 'Shipping Core installer build failed.' }
      - name: Install, trust, diagnose prerequisite, disable and close exact shipping pair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Get-Location
          $driver = Join-Path $base 'integrations/project-workbench/shipping-pairing/test-shipping-host.ps1'
          $powershell = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $arguments = @('-NoProfile', '-NonInteractive', '-STA', '-File', ('"' + $driver + '"'),
            '-HostExe', ('"' + (Join-Path $base 'pairing-host/Workbench.App.exe') + '"'),
            '-PackageDirectory', ('"' + (Join-Path $base 'pairing-package with spaces/com.upcam.task-digest') + '"'),
            '-InstallerExe', ('"' + (Join-Path $base 'pairing-installer/ShippingInstall.exe') + '"'),
            '-InstallReportPath', ('"' + (Join-Path $base 'pairing-evidence/package-install.json') + '"'),
            '-ReportPath', ('"' + (Join-Path $base 'pairing-evidence/shipping-pairing.json') + '"'),
            '-ScreenshotPath', ('"' + (Join-Path $base 'pairing-evidence/shipping-pairing.png') + '"'))
          $process = Start-Process -FilePath $powershell -ArgumentList $arguments -PassThru
          try {
            if (-not $process.WaitForExit(360000)) { $process.Kill($true); throw 'Shipping UIA pairing timed out; owned driver tree stopped.' }
            if (Test-Path pairing-evidence/shipping-pairing.json) { Get-Content pairing-evidence/shipping-pairing.json }
            if ($process.ExitCode -ne 0) { throw 'Shipping pair UIA failed.' }
            $result = Get-Content pairing-evidence/shipping-pairing.json -Raw | ConvertFrom-Json
            if (-not $result.succeeded -or $result.cleanup -cne 'graceful') { throw 'Shipping pairing or graceful cleanup did not pass.' }
          } finally { $process.Dispose() }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UPCAMTaskDigest-0.1.1-Workbench-0.4.0-shipping-pairing
          path: pairing-evidence/
          if-no-files-found: warn
          retention-days: 14
